version: "3.9"

services:
  # ─── Verge gateway ──────────────────────────────────────────────────────────
  verge:
    build: .
    container_name: verge
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env.local
    environment:
      # Override DATABASE_URL so the app always connects to the compose postgres
      # (the value in .env.local is used as the fallback when overriding is not needed)
      DATABASE_URL: postgres://${POSTGRES_USER:-verge}:${POSTGRES_PASSWORD:-verge}@postgres:5432/${POSTGRES_DB:-verge}
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/catalog > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - verge_net

  # ─── Postgres 16 ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: verge_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-verge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-verge}
      POSTGRES_DB: ${POSTGRES_DB:-verge}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-verge} -d ${POSTGRES_DB:-verge}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - verge_net

volumes:
  postgres_data:
    driver: local

networks:
  verge_net:
    driver: bridge
